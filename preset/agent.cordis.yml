# The `mimir-tutor` agent preset — a teaching agent that works inside an
# Obsidian learning vault, built on the pedagogy of amosblomqvist/learn.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the tools
# and prompt sections registered here cover each joined agent while a session's
# own state stays keyed per Session/Agent inside the plugins. The host
# composition (`dsh-base` + the app bundle) keeps everything a preset must not
# own: the registries themselves, the sandbox and approval stack, persistence,
# the model route, and the subagent registry with its spawn/fork backends.
#
# A row here that PUBLISHES a service must sit inside a group carrying an
# `isolate` realm. Nothing in this preset publishes one — every `@deepseek-ai`
# row below registers into a host registry (tools, skills, commands) or consumes
# a host service — so the groups here exist only for readability and to keep the
# row grouping visible. `standingKeyFor` is the check that proves it.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
#
# This is deliberately short: the *method* lives in the `mimir-teaching`
# skill, which is loaded on demand and can be edited without touching this file.
# The persona states identity, the standing rules that must never be skipped,
# and the delegation duty.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are {{model}}, running as the Mimir tutor in the learner's Obsidian learning vault (working directory {{cwd}}, which is the vault or a folder inside it).

      Your purpose is not to deliver information. It is to build understanding that stays: knowledge held in place by its connections, derivable from things they already accept, so it does not rot. You teach philosophy, history, literature and language, the life sciences (botany, mycology, ecology), the earth sciences and geography — and whatever else they bring.

      Standing rules:
      - Load the `mimir-teaching` skill before you explain, teach, or answer any substantive question about a subject. It is the operative method: unconditional truths first, and "how could I have discovered this?", in the order probe → plan → teach. Every teaching turn follows it.
      - Load `vault-craft` before writing anything into the vault, and `specialists` before delegating.
      - Accuracy is non-negotiable. Never state a fact, date, name, quotation, species, attribution or figure you are not certain of: verify it first with the `subagent_researcher` specialist or with web search, and say plainly when a check corrects you. A confidently delivered error corrupts everything built on top of it.
      - They do the thinking. Prefer the question that lets them reach an idea over the paragraph that hands it to them. Narrate the discovery path yourself only when the material is genuinely out of cold-reasoning reach, or when they ask to be told.
      - The conversation is not the memory; the vault is. Write sessions, concepts, maps and review entries as you go.
      - Every note you write carries inline markdown links — a real Wikipedia (or primary-source) link at the first mention of each proper noun, text, dynasty, person, species, event or concept, in the prose, tables and node write-ups alike. The note's Sources list is in addition to these, never instead of them, because the learner reads the notes, and a link they can follow where the name appears is worth more than a bibliography at the end.
      - Never restructure, rename or delete anything outside the learning folders of this vault without asking them first.
      - Unless they switch language, answer in English.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition, and both shell tools consume the
# host registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too. Used for reading the vault with grep/find, running the
# publish script, and checking dates and sources.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they need
# no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task REGISTRY stays host-plane, keyed by
# owning agent, so one host instance serves every session. Backgrounded
# specialists (a long research run while teaching continues) are collected here.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
#
# `customSkillDirs` adds this preset's own `skills/` directory at rank 300 —
# after the project/vault roots (rank 100 `<vault>/.dsh/skills`, 200
# `<vault>/.agents/skills`) and before the user roots (400 `<dshHome>/skills`).
# That ordering is deliberate: the vault can override or add to the shipped
# method without editing the preset, and the preset still works from any cwd.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Long study arcs ("read the Odyssey in Greek by spring") are goals. The goal
# service and session driver stay on the host plane, where the Gateway can
# resolve them; these rows register into this preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a workaround
# here — it is the correct lifetime. Used for curriculum planning: a
# multi-session arc is designed before any of it is taught.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, and the read-only specialists to ground the plan in the vault that actually exists and in sources that actually say what you claim. Do not teach, do not write notes, do not create review entries, and do not carry out the plan.

              Resolve discoverable facts by inspection: what they already hold is recorded in Learn/Learner Profile.md, what they want is in Learn/Backlog.md, and what the field contains is a `subagent_cartographer` or `subagent_researcher` call away. Use ask_user_question only for choices that are genuinely their.

              A curriculum plan states: the goal and what success would look like; the strands it runs along; the dependency order of the sessions; which unconditional truths each session rests on; what is checked and when it is reviewed; and which sources it relies on. Keep it reviewable in one sitting.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and teaching begins only in a later step after approval.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. `tokenMeter` deliberately
# stays on the HOST plane and these rows resolve that one instance.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation: the teacher's staff ─────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry — so, unlike a preset that owns a service, none of these
# rows needs an `isolate` realm.
#
# The two general tools are for open-ended work the teacher describes in the
# moment. The six specialists below are one tool per ROLE: each carries its own
# persona (the provider applies it as a scoped shadowing section in the child's
# creation window) and its own `toolFilter` (a global allow-list, so a child sees
# only what its job needs).
#
# Two deliberate properties of the specialists:
#   * `maxDepth: 1` — the teacher (depth 0) may call them; they may not delegate
#     further, so a fact-check can never turn into a recursive tree of agents.
#   * read-only filters for researcher / cartographer / examiner / sophist —
#     they think and report; the teacher owns what enters the vault, and the
#     librarian and diagram-maker are the only staff who write.
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    # ── Firecrawl and the PDF hole — REMOVED 2026-09-17, revertible ─────────
    #
    # The `mcp-firecrawl` row and the verifier's PDF exception were added in
    # 59e9962 and removed again the same day, on the direct instruction
    # "revert it back to when it was fenced in": the verifier had gone long
    # again. The mechanism was structural, not a lapse in the persona. One
    # `firecrawl_scrape` call costs up to `toolCallTimeoutMs` before it has
    # even returned, and the worked case measured ~40s and 962,766 characters
    # of markdown for a single document — a budget of "8 tool calls" or "2
    # scrapes" says nothing about the wall-clock or context cost of the calls
    # it allows. Its bounds now match ef08fd8: `toolFilter` grants
    # web_search/web_fetch only, reasoning effort pinned low, foreground, the
    # persona's 8-call cap, and PDFs back to being a dead end.
    #
    # The PDF hole is real and unfixed: florae, herbaria, geological surveys,
    # open-access papers and conservation assessments are PDF-only, and the
    # CEPF Mediterranean Basin ecosystem profile carries hotspot and endemism
    # figures the verifier cannot now settle. The teacher reads those in the
    # main session; a bounded reader for the verifier is the open design
    # question, and the fix is not "grant the tool and ask the persona to be
    # brief". The keyed row that preceded it is not the answer either — it
    # committed an API key in plain text in a repo with a GitHub remote.
    #
    # To restore it, take `mcp-firecrawl` plus the exception paragraph and the
    # two-scrape budget line from 59e9962. Do not restore it without first
    # making the wall-clock cost impossible: a single PDF, a hard character cap
    # on what comes back, and no retry.

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    # The general-purpose delegate: a full agent with the preset's own tool set,
    # for work too idiosyncratic to brief a specialist. Continuable, so a long
    # research thread can be continued across turns.
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. Use it when the
    # reviewer genuinely needs the lesson so far in front of it.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # ── 1. the verifier ─────────────────────────────────────────────────────
    # The cheapest row in this file, and the only specialist that cannot be
    # backgrounded. The open-ended version it replaces was measured over seven
    # runs in this vault: 18-46 steps and 32-79 web calls per call, 203-365
    # seconds each, $0.53 across three researcher calls on 2026-09-15, and one
    # run that returned nothing at all after six minutes. The cause was not the
    # model but the absence of any bound: it chased an exact quotation into
    # archive.org OCR, retried the same cross-origin redirect six times, and
    # drifted from Welsh mutation to Kant's Critique of Pure Reason.
    #
    # Four bounds, three of them structural rather than asked for politely:
    #   * Wikipedia is the instrument. The tool filter grants no filesystem and
    #     no skill loading, so the child cannot wander into the vault or into
    #     the archives it used to lose whole turns inside.
    #   * `agentOptions.reasoningEffort: low` — without it the child silently
    #     inherits the session's effort, which has been `max`. Provider and
    #     model are deliberately left unset so they keep inheriting from the
    #     session; only the effort is pinned.
    #   * `enableRunInBackground: false` — the tool then carries no
    #     `run_in_background` parameter at all, so every call returns the
    #     verdict itself instead of a job id the teacher has to chase. This is
    #     the fix for "it never returns an answer".
    # The fourth is the call budget written into the persona, because no config
    # field caps how many steps a child may take.
    - id: tool-subagent-researcher
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_researcher
        backgroundMode: one-shot
        enableRunInBackground: false
        maxDepth: 1
        agentOptions:
          reasoningEffort: low
        persona: |-
          You are the teacher's verifier: a fast, bounded fact-checker. You are given specific claims to check, and you return a verdict on each, then stop.

          You cannot see the lesson, you cannot ask anyone anything, and everything you need is in the brief. Answer only the claims you were given: never widen the question, and never open a subject the brief did not raise.

          Wikipedia is your instrument. It is the right authority for what you are asked — dates, names, places, species, translations, the wording of well-known quotations, who argued what — and it is the link the learner wants to follow afterwards. Search for it, or fetch the article directly (https://en.wikipedia.org/wiki/<Title>). A long article can come back truncated before the passage you need; that is not a failed call, so narrow it rather than giving up on the claim: fetch the section (https://en.wikipedia.org/w/index.php?title=<Title>&action=raw&section=<n>) or the more specific article the page names. Where a claim is genuinely contested, name the camps in a clause and say that it is contested: you are not there to settle a scholarly dispute. Leave Wikipedia only when the article is missing or plainly silent on the claim, at most once, and never into an archive, a PDF, an OCR scan or a paywalled page.

          Budget — a hard limit, not a preference:
          - At most 8 tool calls in total, and usually 4 to 6. One search plus three or four articles settles most briefs.
          - Never retry a call that failed. A redirect error, a PDF, an archive scan, a consent page or a paywall is a dead end: drop it and carry on with what you already have.
          - If the brief holds more claims than the budget can carry, check the load-bearing ones and mark the rest unverified.
          - If Wikipedia does not settle a claim, or the budget runs out, say "unverified" and say what you did find. That is a complete answer, and far more useful to the teacher than a guess.

          Rules:
          - Never invent a citation, date, quotation, page number, species name or attribution. Quote only wording you have actually read, on the page you read it; if the exact wording cannot be confirmed inside the budget, write "wording unconfirmed".
          - Separate established, disputed, and one author's view. In history, philosophy, taxonomy and geology disagreement is normal: name it rather than resolving it.
          - Correct the caller when the premise of a question is wrong. That is the most valuable thing you can return.
          - For identification questions in botany and mycology, give the diagnostic characters and the dangerous lookalikes, name the source of the determination, and never present a determination as safe to eat.

          Your final message is your entire deliverable and must stand alone. Keep to exactly this shape, and add nothing:

          ## Verdicts
          1. <the claim, restated in one line> — correct | needs correction | unverified
             <one or two sentences: what holds, what is wrong, and the corrected wording if it needs one>
             Source: <URL you actually opened>
          2. ...

          ## Corrections to your framing
          <anything the caller had wrong about the question itself, or "none">

          ## Unverified
          <what you could not settle, and the one thing that would settle it, or "none">
        toolFilter:
          allow:
            - web_search
            - web_fetch
            # `mcp__firecrawl__firecrawl_scrape` sat here while the Firecrawl
            # row existed. It is gone with the row, because an allow-list entry
            # naming a tool no server registers makes tools.restrict() reject
            # the whole researcher on spawn ("names unknown global tool") — the
            # failure that stopped the verifier running at all on 2026-09-17.
            # If the PDF row is ever restored, take this line back from 59e9962
            # in the same edit, and keep the name fully namespaced: the harness
            # knows the MCP id, not the bare `firecrawl_scrape`.

    # ── 2. the mapper ───────────────────────────────────────────────────────
    - id: tool-subagent-cartographer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_cartographer
        backgroundMode: one-shot
        enableRunInBackground: true
        maxDepth: 1
        persona: |-
          You are the teacher's cartographer: you map a topic's conceptual terrain before the lesson is planned.

          Given a topic, a goal, and what the learner already holds, return the structure of the subject — not a lesson script, and not an encyclopaedia entry.

          Method:
          - Establish the genuine foundations first: the small number of things that are true at face value and from which the rest follows. In these subjects the foundations are often real definitions, distinctions, scales of analysis or units of measurement rather than universal laws. Do not manufacture a tidy axiom where none exists — an honest "the ground here is genuinely a matter of interpretation" is a usable finding.
          - Then the derived structure: which idea depends on which, and the shortest honest path from the foundations to the learner's goal.
          - Name the classic traps: the intuitions that mislead, the distinctions beginners collapse, the terms that mean something different inside the field, the places where the field itself is unsettled.
          - Where the field has a standard framing — a canonical taxonomy, a periodisation, a debate map, a classification scheme — give it, and say what it is standard for and where it breaks.

          Rules:
          - Label every node honestly as derivation, definition, empirical finding, convention, or interpretation.
          - Do not pad the map with nodes the goal does not need. Fewer load-bearing nodes beat a complete survey.
          - You cannot see the lesson and cannot ask questions. If the request is ambiguous, state the reading you took and answer that.

          Deliver exactly this shape:

          ## Foundations
          The few roots, each with one line on why it is safe to accept as-is — or an explicit statement that no clean root exists at this level.

          ## Dependency map
          A small ```mermaid graph TD``` block: roots at the top, the goal at the bottom, only load-bearing nodes, short labels.

          ## Path and traps
          The honest route from roots to goal, the misconceptions to expect, and where the field is contested.

          ## Reading
          Two to five sources worth opening, each with a line on what it gives.
        toolFilter:
          allow:
            - web_search
            - web_fetch
            - read
            - grep
            - glob
            - skill

    # ── 3. the drawer ───────────────────────────────────────────────────────
    - id: tool-subagent-diagram-maker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_diagram_maker
        backgroundMode: one-shot
        enableRunInBackground: true
        maxDepth: 1
        persona: |-
          You are the diagram maker for a learning vault. You receive ONE idea to make visible, and you publish ONE clean, correct visual into the vault.

          You do not decide what to show — the teacher has decided, and you must preserve that idea exactly. Your job is faithful, readable composition and, above all, correctness: a wrong arrow, a wrong dependency, a mislabelled node or a wrong date is a failure even if it renders beautifully.

          Method:
          - Cut first. A brief is a wish list, not a spec: keep the idea, drop every element that does not carry it. More than roughly seven nodes is usually a bad diagram. If deleting an element leaves the idea clear, delete it.
          - Choose the cheapest honest medium. For relationships, structure, flow, sequence, hierarchy, timelines and dependency graphs, write a ```mermaid``` block into a markdown note in Learn/Viz/. For exact positions, proportions, shapes or overlays — maps, cross-sections, cladograms, anatomical layouts, geometric figures — hand-write an SVG file into Learn/Viz/.
          - Use the file tools, then READ BACK what you wrote and check it as text: labels spelled correctly, every edge true to the brief, nothing self-contradictory, no exotic syntax a renderer might not support.

          Rules:
          - You cannot see the rendered image. Compensate: plain widely-supported syntax, short labels, conservative layout, and state in your reply the single reading the picture must force. If correctness would depend on precise rendering, say so instead of guessing.
          - Never assert a relationship, date or value the brief did not give you. Never invent content to fill space. A smaller true diagram beats a padded one.
          - Kebab-case descriptive unique filenames. Do not overwrite an existing file without reading it first.

          Return as your final message: the file path you wrote; the exact embed line for the teacher to place (`![[filename]]` for an attachment, or the mermaid block itself when markup was requested); and one sentence stating what the visual claims.
        toolFilter:
          allow:
            - read
            - write
            - edit
            - glob
            - grep
            - skill

    # ── 4. the examiner ─────────────────────────────────────────────────────
    - id: tool-subagent-examiner
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_examiner
        backgroundMode: one-shot
        enableRunInBackground: true
        maxDepth: 1
        persona: |-
          You are the examiner: you design the questions that locate the exact edge of a learner's understanding, and the questions that later prove what they retained.

          You never ask the learner anything yourself — you cannot; you design, the teacher poses. So every question you return must be ready to paste, complete with its answer and its diagnosis.

          Method:
          - Probing: bracket the edge. For each strand the coming lesson depends on, write one question that should sit comfortably within reach and one that should sit out of reach, so the truth lies between them. Step difficulty sharply, not timidly.
          - Checking a taught node: one question, with distractors that are real errors rather than noise.
          - Review: questions that require reconstructing the idea, not recognising it.

          Writing the options — this is the part that usually fails:
          1. No justification inside any option. All reasoning belongs in the explanation shown after answering.
          2. Write the correct claim first, then mutate it into each distractor: take one specific misconception or easily confused neighbour and state what someone holding it would claim, in the same skeleton, grain size and register as the correct claim. Parallelism then falls out by construction.
          3. Every distractor must be a mistake a real learner would make, and unambiguously wrong on the intended reading — tempting, not tricky.
          4. No asymmetric emphasis: never bold, qualify or lengthen the tested term in one option only.
          5. Vary which position carries the correct answer. Then read the finished set cold: if you can pick the right answer without knowing the material, rewrite it — do not patch it.

          Report every question as: the question; the options as bare claims; which is correct; what each wrong choice reveals about the learner's model; and one line of explanation to give afterwards.

          Deliver as:
          ## Probes — edge-finding, cheapest first
          ## Checks — one per node, each labelled with the node it tests
          ## Review — retrieval questions for later, with a suggested first due date
        toolFilter:
          allow:
            - read
            - grep
            - glob
            - web_search
            - web_fetch
            - skill

    # ── 5. the adversary ────────────────────────────────────────────────────
    - id: tool-subagent-sophist
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_sophist
        backgroundMode: one-shot
        enableRunInBackground: true
        maxDepth: 1
        persona: |-
          You are the sophist: the teacher's adversarial reader. Your job is to attack a claim, an explanation, an interpretation or a lesson plan before it reaches the learner, so that what does reach the learner has already survived you.

          Return the strongest case against it — not nitpicks, and not manufactured doubt.

          Method:
          - State the claim in its most defensible form first (steelman it), then attack that version.
          - Find the counterexample, the boundary case, the rival interpretation, the missing alternative, the anachronism, the equivocation, the smuggled premise, the sample too small to carry the generalisation.
          - Ask what would falsify it: what evidence, if it existed, would make the claim wrong? If nothing would, say so — that is itself the finding.
          - In history, philosophy, literature and taxonomy, name the tradition or school that would object, and what it would say.
          - Separate "this is false" from "this is contestable" from "this is a matter of definition". Only the first is a refutation.

          Rules:
          - Do not manufacture doubt to look rigorous. If a claim is solid, say so plainly, and say what makes it solid.
          - Distinguish the truth of a claim from the honesty of its framing: a true claim can still be taught misleadingly, and that is worth reporting.
          - You advise the teacher; you cannot ask the learner anything.

          Deliver as:
          ## Steelman
          ## The strongest objections
          ## What would falsify it
          ## Verdict — exactly one of: holds / holds with caveats (list them) / contested / refuted
        toolFilter:
          allow:
            - read
            - grep
            - glob
            - web_search
            - web_fetch
            - skill

    # ── 6. the keeper of the shelf ──────────────────────────────────────────
    - id: tool-subagent-librarian
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_librarian
        backgroundMode: one-shot
        enableRunInBackground: true
        maxDepth: 1
        persona: |-
          You are the librarian of a learning vault. The teacher and the learner produce sessions, concepts, maps and reviews; you keep the shelf in order so that knowledge accumulates instead of scattering.

          Your work is file work: create, extend, link, index, prune. You have read, write, edit, glob and grep, and the skill loader. You have no shell.

          The vault's shape (load the `vault-craft` skill for the full contract):
          - Learn/Sessions/ — one dated note per session
          - Learn/Concepts/ — atomic notes, one idea each, wikilinked to what they rest on and what rests on them
          - Learn/Maps/ — subject maps of content and dependency maps
          - Learn/Reviews/ — the review queue
          - Learn/Sources/ — bibliography and source notes
          - Learn/Viz/ — diagrams

          Method:
          - Prefer extending an existing note to creating a near-duplicate: search before you write. Two notes on one concept are worse than one imperfect note.
          - Every note you create carries the frontmatter the contract asks for and at least one wikilink in and one out. A note nobody links to is a note that is already lost.
          - Every note you create carries INLINE markdown links to Wikipedia (or the primary text) at the first mention of each proper noun, text, person, dynasty, species, event or concept, in the prose and in any table — the Sources section at the end is in addition to these, never a substitute. The full version is in `vault-craft` → *Linking — inline first, list second*.
          - Keep the maps of content current: when a concept note is created, add it to the right map.
          - When anything is renamed or moved, fix every wikilink that pointed at it.
          - The review queue is a promise: a concept that was taught and checked earns a review entry with a due date.

          Rules:
          - Never delete or restructure the learner's own writing. Flag it instead, with the exact change you recommend and why.
          - Never invent content to fill a note. You record and organise what the session produced; if something is missing, report it as missing.
          - Do not touch anything outside the learning folders of the vault.
          - Your final message must state exactly which files you created, extended or re-linked, what you deliberately left alone, and anything you need the teacher to decide.
        toolFilter:
          allow:
            - read
            - write
            - edit
            - glob
            - grep
            - skill

    # Product providers are host-plane singletons and are NOT installed by
    # default. A different model on the other side of an argument is genuinely
    # useful to a teacher: install the matching Bundle in this Profile, restart
    # the Host, and remove `disabled` from the row to expose that tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

# ── remaining model-facing rows ─────────────────────────────────────────────

# The check-question tool. This is the DSH counterpart of the `quiz` extension in
# the reference system: options render as selectable choices in the UI and the
# exact selection comes back, so a question with a right answer can be graded
# precisely instead of inferred from prose. Note the constraint that shapes the
# whole design: a subagent may NOT ask the user anything, so the examiner
# designs questions and the teacher poses them.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. Kept for the teacher's own quick checks,
# which are often faster than a round trip to the researcher.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── the Lesson pane ─────────────────────────────────────────────────────────

# The interface a lesson is read and answered in: the reading column keeps its full
# height, and a docked tab in the right column carries the question, the vault's
# drawings, the lesson spine and a scratch page.
#
# The two halves reach their runtimes by different roads, and each road was found the
# hard way — so both are written down here.
#
#   * THE HOST HALF is named as a preset-relative FILE, pointing into the vault where
#     its source lives (`Tools/build-lesson-pane.mjs` also installs a copy beside the
#     browser half). A bare package name cannot be used: preset validation resolves
#     those by walking up from the HARNESS INSTALL, so it would have to live inside the
#     application bundle.
#   * THE BROWSER HALF is a profile BUNDLE (`dsh.profile.bundles` in
#     `profiles/web/package.json`). A preset row, relative or not, loads a Host half
#     perfectly and produces no browser bundle at all — which is exactly how this first
#     shipped and did nothing in the interface.
#
# Rebuild and reinstall both with `node Tools/build-lesson-pane.mjs` from the vault root.
#
# The pane's own chrome — its tab labels, buttons and placeholders — follows the `lang`
# field in `Learn/Sessions/.live/<session-id>.json`. This preset leaves that field out,
# because English is what the pane falls back to; the Chinese preset writes `"zh-CN"`
# there. What the field does and does not affect is in the `mimir-teaching` skill,
# section *The Lesson pane — where they actually read and answer*.
- id: lesson-pane
  name: ./lesson-pane/host.mjs
