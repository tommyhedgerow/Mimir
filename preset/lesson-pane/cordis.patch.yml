# This package's layer in the DSH profile stack.
#
# `dsh plugin --profile web add <this package>` installs it and appends
# `dsh-mimir-lesson-pane` to `dsh.profile.bundles`, which is what makes DSH serve
# `exports["./client"]` to the page. The insert row below is the other half: a
# bundle row resolves by PACKAGE NAME, and the profile is the base those names
# resolve from, so this is where the plugin actually gets composed in.
#
# The host half is mounted twice on purpose, and the double mount is safe:
# `preset/lesson-pane/host.mjs` claims its routes through a process-level,
# reference-counted registry (`Symbol.for('dsh-mimir-lesson-pane.routes')`), so the
# preset's own `./lesson-pane/host.mjs` row and this bundle's `lib/index.js` share
# one set of routes rather than fighting over the paths. The registry exists
# precisely so a preset can be remounted in a live process without a route its own
# predecessor still holds failing the mount.
- insert:
    - id: lesson-pane
      name: dsh-mimir-lesson-pane
