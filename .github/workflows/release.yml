# Cut a release on a bare `x.y.z` tag, or any `v*` tag for the vault itself.
#
# The release carries the two things a stranger needs: the `.dshpreset`, which
# is the teacher as a single importable file, and its SHA-256, so the download
# can be verified without trusting the connection it came over.

name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build the preset package
        run: ./scripts/pack-preset.sh

      - name: Build the plugin tarball
        run: ./scripts/pack-plugin.sh

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Both presets, and their checksums. Listing the files explicitly is
          # deliberate — a glob would silently ship a stray file one day — but it
          # means this list has to be kept in step with the PRESETS the packer
          # knows about. It was not, on the first bilingual release: the Chinese
          # package was built, validated, and then left out of the release.
          # The board's tarball is uploaded under a VERSION-FREE name on purpose.
          # The plugin catalog points its `tarball:` field at
          # `releases/latest/download/<name>`, which resolves `latest` at request
          # time but takes the filename literally — so a name carrying the version
          # works the day it is published and 404s the moment the next release is
          # cut. `#` sets the asset name; the local file keeps its version because
          # that is what npm's own conventions want.
          gh release create "$tag" --title="$tag" --generate-notes \
            dist/mimir-tutor.dshpreset \
            dist/mimir-tutor.dshpreset.sha256 \
            dist/mimir-tutor-zh.dshpreset \
            dist/mimir-tutor-zh.dshpreset.sha256 \
            "dist/dsh-mimir-skin.tgz#dsh-mimir-skin.tgz"
